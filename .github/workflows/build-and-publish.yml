name: Build, Test and Publish
on:
  push:
    branches:
      - "*"
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Tag name of release, as displayed on GitHub (i.e. no ref/tags/ prefix.)"
        required: true
        type: string
      release:
        description: "Whether this workflow call is for a release (the release must already exist for the given tag)."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name of release, as displayed on GitHub (i.e. no ref/tags/ prefix.)"
        required: true
        type: string
      release:
        description: "Whether this workflow call is for a release (the release must already exist for the given tag)."
        required: false
        default: false
        type: boolean
env:
  GODOT_VERSION: "4.7.1-stable"

permissions:
  contents: write

jobs:
  get-tag:
    name: Get Tag (version or other ref name)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
      is-main: ${{ steps.get-tag.outputs.is-main }}
    steps:
      - name: Get Release Tag
        id: get-tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "Tag will be: ${{ inputs.tag }}"
            tag="${{ inputs.tag }}"
          else
            echo "Tag will be: ${{ github.ref_name }}"
            tag="${{ github.ref_name }}"
          fi
          main_version_regex='^v[0-9]+[.][0-9]+[.][0-9]+$'
          if [[ "${tag}" =~ $main_version_regex ]]; then
            echo "Tag is a main release."
            echo "is-main='true'" >> $GITHUB_OUTPUT
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT
  build:
    name: Build All
    needs: get-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Godot Engine
        uses: "./.github/actions/install-godot"
        with:
          version: "4.7.1-stable"
          sha_256: "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          platform: "linux.x86_64"
      - name: Install Export Templates
        uses: "./.github/actions/install-export-templates"
        with:
          version: "4.7.1-stable"
          sha_256: "86409db6200b6f8fd3230989c2d2002851f3dd18acf11d7bdbafddf5a0dd0f72"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          sed -i 's/\(config\/version="\).*\("\)/\1${{ needs.get-tag.outputs.tag }}\2/' project.godot
      - name: Build Any Platform # This step is just to verify there are no build errors.
        if: ${{ ( github.event_name != 'release' || needs.get-tag.outputs.is-main != 'true' ) && ( ( github.event_name != 'workflow_call' && github.event_name != 'workflow_dispatch' ) || github.event.inputs.release == false ) }}
        run: make linux-x86_64
      - name: Build All
        id: build-all
        # We only build and package for all platforms for releases, to save
        # on workflow minutes and artifact storage.
        if: ${{ ( github.event_name == 'release' && needs.get-tag.outputs.is-main == 'true' ) || ( ( github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' ) && github.event.inputs.release == true ) }}
        run: make
      - name: Package All
        id: package-all
        if: ${{ steps.build-all.outcome == 'success' }}
        run: |
          # TODO: Combine tarball and zip steps into one for loop
          BUILDS=('linux-x86_64' 'linux-x86_32' 'linux-arm64' 'windows-x86_64' 'windows-x86_32' 'windows-arm64' 'macos-universal' 'web')
          for build in "${BUILDS[@]}"; do
            mkdir -p zip_root
            cp -r build/${build}/* zip_root # Needs -r because macOS' .app files are actually folders.
            rm -f zip_root/.gitkeep
            (cd zip_root && zip -r \
              "../advanced-invasion-${build}-${{ needs.get-tag.outputs.tag }}.zip" \
              ./*)
            rm -rf zip_root
          done
          TARBUILDS=('linux-x86_64' 'linux-x86_32' 'linux-arm64')
          for tarbuild in "${TARBUILDS[@]}"; do
            mkdir -p zip_root
            cp -r build/${build}/* zip_root # Needs -r because macOS' .app files are actually folders.
            rm -f zip_root/.gitkeep
            (cd zip_root && tar -czf \
              "../advanced-invasion-${tarbuild}-${{ needs.get-tag.outputs.tag }}.tar.gz" \
              ./*)
            rm -rf zip_root
          done
      - name: Upload Build Artifacts
        if: steps.package-all.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: builds
          path: advanced-invasion-*-${{ needs.get-tag.outputs.tag }}.*
  # test:
  #   name: Run Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout Repo
  #       uses: actions/checkout@v7
  #     - name: Run gdUnit4 Tests
  #       uses: MikeSchulze/gdUnit4-action@v1
  #       with:
  #         godot-version: "4.7.1"
  #         godot-status: "stable"
  #         paths: |
  #           res://test
  #         version: "v6.1.3"
  #         publish-report: false # true causes failure due to read-only permission
  publish:
    name: Publish release
    needs: [get-tag, build]
    runs-on: ubuntu-latest
    if: ${{ ( github.event_name == 'release' && needs.get-tag.outputs.is-main == 'true' ) || ( ( github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' ) && github.event.inputs.release == true ) }}
    steps:
      - name: Download Builds
        uses: actions/download-artifact@v8
        with:
          name: builds
          skip-decompress: false
          merge-multiple: true
      - name: Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ needs.get-tag.outputs.tag }}" \
            advanced-invasion-*-${{ needs.get-tag.outputs.tag }}.* \
            --repo "${{ github.repository }}"
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Copy patch notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit \
            "${{ needs.get-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes/$(if [ -f release-notes/${{ needs.get-tag.outputs.tag }}.md ]; then echo "${{ needs.get-tag.outputs.tag }}.md"; else echo "latest.md"; fi)

