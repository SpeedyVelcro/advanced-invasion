name: Build and Publish (Game Jolt)
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Tag name of release, as displayed on GitHub (i.e. no ref/tags/ prefix.)"
        required: true
        type: string
env:
  GODOT_VERSION: "4.7.1-stable"
permissions:
  contents: write
jobs:
  get-tag:
    name: Get Release Tag
    runs-on: ubuntu-latest
    steps:
      name: Get Release Tag
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi
  build-game_jolt:
    # Build using custom export templates with encryption key, except macOS.
    name: Build non-macOS for Game Jolt
    iD: build-game_jolt
    runs-on: ubuntu-22.04
    if: endsWith( jobs.get-tag.outputs.tag, '-gj' )
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Godot Engine
        uses: "./.github/actions/install-godot"
        with:
          version: "4.7.1-stable"
          sha_256: "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          platform: "linux.x86_64"
      - name: Build Export Templates (Linux x86_64)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "linuxbsd"
          arch: "x86_64"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Linux x86_32)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "linuxbsd"
          arch: "x86_32"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Linux arm64)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "linuxbsd"
          arch: "arm64"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Windows x86_64)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "windows"
          arch: "x86_64"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Windows x86_32)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "windows"
          arch: "x86_32"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Windows arm64)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "windows"
          arch: "arm64"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Web)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "web"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          sed -i 's/\(config\/version="\).*\("\)/\1${{ jobs.get-tag.outputs.tag }}\2/' project.godot
      - name: Build project
        run: make game_jolt-except-macos
      - name: Package All
        id: package-all
        run: |
          # TODO: Combine tarball and zip steps into one for loop
          BUILDS=('linux-x86_64' 'linux-x86_32' 'linux-arm64' 'windows-x86_64' 'windows-x86_32' 'windows-arm64' 'web')
          for build in "${BUILDS[@]}"; do
            mkdir -p zip_root
            cp -r build/game_jolt/${build}/* zip_root
            rm -f zip_root/.gitkeep
            (cd zip_root && zip -r \
              "../advanced-invasion-${build}-${{ jobs.get-tag.outputs.tag }}.zip" \
              ./*)
            rm -rf zip_root
          done
          TARBUILDS=('linux-x86_64' 'linux-x86_32' 'linux-arm64')
          for tarbuild in "${TARBUILDS[@]}"; do
            mkdir -p zip_root
            cp -r build/game_jolt/${build}/* zip_root
            rm -f zip_root/.gitkeep
            (cd zip_root && tar -czf \
              "../advanced-invasion-${tarbuild}-${{ jobs.get-tag.outputs.tag }}.tar.gz" \
              ./*)
            rm -rf zip_root
          done
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: game_jolt-builds
          path: advanced-invasion-*-${{ jobs.get-tag.outputs.tag }}.*
  build-game_jolt-macos:
    name: Build macOS for Game Jolt
    id: build-game_jolt-macos
    runs-on: macos-latest
    if: endsWith( jobs.get-tag.outputs.tag, '-gj' )
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # Don't think my install script would work on macos, and I'm not sure how
      # I'd adapt it to use the macOS universal bundle that the GitHub distributes.
      # Just using brew seems easiest for now.
      - name: Install Godot Engine
        run: brew install godot@4.7.1
#      - name: Install Godot Engine
#        uses: "./.github/actions/install-godot"
#        with:
#          version: "4.7.1-stable"
#          sha_256: "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
#          platform: "linux.x86_64"
      - name: Build Export Templates (macOS Universal)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "macos"
          arch: "universal"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          sed -i 's/\(config\/version="\).*\("\)/\1${{ jobs.get-tag.outputs.tag }}\2/' project.godot
      - name: Inject PCK Encryption Keys
        run: |
          ./inject-pck-encryption-key.sh game_jolt-linux-x86_64 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-linux-x86_32 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-linux-arm64 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-windows-x86_64 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-windows-x86_32 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-windows-arm64 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-macos-universal ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-web ${{ secrets.PCK_ENCRYPTION_KEY }}
      - name: Build project
        run: make game_jolt-macos-universal
      - name: Package
        id: package
        run: |
          mkdir -p zip_root
          cp -r build/game_jolt/macos-universal/* zip_root
          rm -f zip_root/.gitkeep
          (cd zip_root && zip -r \
              "../advanced-invasion-macos-universal-${{ jobs.get-tag.outputs.tag }}.zip" \
              ./*)
          rm -rf zip_root
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: game_jolt-macos-builds
          path: advanced-invasion-macos-universal-${{ jobs.get-tag.outputs.tag }}.zip
  publish:
    name: Publish Game Jolt Release
    runs-on: ubuntu-latest
    needs: [build-game_jolt, build-game_jolt-macos]
    steps:
      - name: Download Non-macOS Builds
        uses: actions/download-artifact@v8
        with:
          name: game_jolt-builds
          skip-decompress: false
          merge-multiple: true
      - name: Download macOS builds
        uses: actions/download-artifact@v8
        with:
          name: game_jolt-macos-builds
          skip-decompress: false
          merge-multiple: true
      - name: Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ jobs.get-tag.outputs.tag }}" \
            advanced-invasion-*-${{ jobs.get-tag.outputs.tag }}.* \
            --repo "${{ github.repository }}"
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Compile Release Notes
        run: |
          notes_file=$(if [ -f release-notes/${{ jobs.get-tag.outputs.tag }}.md ]; then echo "${{ jobs.get-tag.outputs.tag }}.md"; else echo "latest.md"; fi)
          echo "This release comprises the Game Jolt builds, which you would typically obtain through the game's Game Jolt page. There is no reason to use these if you are not a Game Jolt user. Instead, see the main release: [${{ jobs.get-tag.outputs.tag }}](https://github.com/SpeedyVelcro/advanced-invasion/releases/tag/${{ jobs.get-tag.outputs.tag }})" > release-notes.md
          echo "\n" >> release-notes.md
          cat $notes_file >> release-notes.md
      - name: Copy Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit \
            "${{ jobs.get-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md

