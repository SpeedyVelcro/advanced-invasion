name: Build and Publish (Game Jolt)
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Tag name of release, as displayed on GitHub (i.e. no ref/tags/ prefix.)"
        required: true
        type: string
      release:
        description: "Whether this workflow call is for a release (the release must already exist for the given tag)."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name of release, as displayed on GitHub (i.e. no ref/tags/ prefix.)"
        required: true
        type: string
      release:
        description: "Whether this workflow call is for a release (the release must already exist for the given tag)."
        required: false
        default: false
        type: boolean
env:
  GODOT_VERSION: "4.7.1-stable"
permissions:
  contents: write
jobs:
  get-tag:
    name: Get Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get Release Tag
        id: get-tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "Tag will be: ${{ inputs.tag }}"
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "Tag will be: ${{ github.ref_name }}"
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
  build-game_jolt:
    name: Build for Game Jolt
    needs: get-tag
    runs-on: ubuntu-22.04
    if: ${{ endsWith( needs.get-tag.outputs.tag, '-gj' ) }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Godot Engine
        uses: "./.github/actions/install-godot"
        with:
          version: "4.7.1-stable"
          sha_256: "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          platform: "linux.x86_64"
      - name: Build Export Templates (Linux x86_64)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "linuxbsd"
          arch: "x86_64"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Linux x86_32)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "linuxbsd"
          arch: "x86_32"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Web)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "web"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          sed -i 's/\(config\/version="\).*\("\)/\1${{ needs.get-tag.outputs.tag }}\2/' project.godot
      - name: Inject PCK Encryption Keys
        run: |
          ./inject-pck-encryption-key.sh game_jolt-linux-x86_64 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-linux-x86_32 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-web ${{ secrets.PCK_ENCRYPTION_KEY }}
      - name: Build project
        run: make game_jolt-linux-x86_64 game_jolt-linux-x86_32 game_jolt-web
      - name: Package All
        id: package-all
        run: |
          # TODO: Combine tarball and zip steps into one for loop
          BUILDS=('linux-x86_64' 'linux-x86_32' 'web')
          for build in "${BUILDS[@]}"; do
            mkdir -p zip_root
            cp -r build/game_jolt/${build}/* zip_root
            rm -f zip_root/.gitkeep
            (cd zip_root && zip -r \
              "../advanced-invasion-${build}-${{ needs.get-tag.outputs.tag }}.zip" \
              ./*)
            rm -rf zip_root
          done
          TARBUILDS=('linux-x86_64' 'linux-x86_32')
          for tarbuild in "${TARBUILDS[@]}"; do
            mkdir -p zip_root
            cp -r build/game_jolt/${build}/* zip_root
            rm -f zip_root/.gitkeep
            (cd zip_root && tar -czf \
              "../advanced-invasion-${tarbuild}-${{ needs.get-tag.outputs.tag }}.tar.gz" \
              ./*)
            rm -rf zip_root
          done
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: game_jolt-builds
          path: advanced-invasion-*-${{ needs.get-tag.outputs.tag }}.*
  build-game_jolt-windows:
    name: Build Windows for Game Jolt
    needs: get-tag
    # Newer GCC (so newer ubuntu) required for winRT
    runs-on: ubuntu-latest
    if: ${{ endsWith( needs.get-tag.outputs.tag, '-gj' ) }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Godot Engine
        uses: "./.github/actions/install-godot"
        with:
          version: "4.7.1-stable"
          sha_256: "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          platform: "linux.x86_64"
      - name: Build Export Templates (Windows x86_64)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "windows"
          arch: "x86_64"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Windows x86_32)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "windows"
          arch: "x86_32"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Build Export Templates (Windows arm64)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "windows"
          arch: "arm64"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          sed -i 's/\(config\/version="\).*\("\)/\1${{ needs.get-tag.outputs.tag }}\2/' project.godot
      - name: Inject PCK Encryption Keys
        run: |
          ./inject-pck-encryption-key.sh game_jolt-windows-x86_64 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-windows-x86_32 ${{ secrets.PCK_ENCRYPTION_KEY }}
          ./inject-pck-encryption-key.sh game_jolt-windows-arm64 ${{ secrets.PCK_ENCRYPTION_KEY }}
      - name: Build project
        run: make game_jolt-windows-x86_64 game_jolt-windows-x86_32 game_jolt-windows-arm64
      - name: Package All
        id: package-all
        run: |
          BUILDS=('windows-x86_64' 'windows-x86_32' 'windows-arm64')
          for build in "${BUILDS[@]}"; do
            mkdir -p zip_root
            cp -r build/game_jolt/${build}/* zip_root
            rm -f zip_root/.gitkeep
            (cd zip_root && zip -r \
              "../advanced-invasion-${build}-${{ needs.get-tag.outputs.tag }}.zip" \
              ./*)
            rm -rf zip_root
          done
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: game_jolt-windows-builds
          path: advanced-invasion-*-${{ needs.get-tag.outputs.tag }}.*
  build-game_jolt-arm64:
    name: Build Linux arm64 for Game Jolt
    needs: get-tag
    runs-on: ubuntu-22.04-arm
    if: ${{ endsWith( needs.get-tag.outputs.tag, '-gj' ) }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Godot Engine
        uses: "./.github/actions/install-godot"
        with:
          version: "4.7.1-stable"
          sha_256: "8f527179cd4ae58b402fa265fe817dc505e5b6b14574f309efe57113be562ac1"
          platform: "linux.arm64"
      - name: Build Export Templates (Linux arm64)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "linuxbsd"
          arch: "arm64"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          sed -i 's/\(config\/version="\).*\("\)/\1${{ needs.get-tag.outputs.tag }}\2/' project.godot
      - name: Inject PCK Encryption Keys
        run: |
          ./inject-pck-encryption-key.sh game_jolt-linux-arm64 ${{ secrets.PCK_ENCRYPTION_KEY }}
      - name: Build project
        run: make game_jolt-linux-arm64
      - name: Package All
        id: package-all
        run: |
          mkdir -p zip_root
          cp -r build/game_jolt/linux-arm64/* zip_root
          rm -f zip_root/.gitkeep
          (cd zip_root && zip -r \
            "../advanced-invasion-linux-arm64-${{ needs.get-tag.outputs.tag }}.zip" \
            ./*)
          (cd zip_root && tar -czf \
            "../advanced-invasion-linux-arm64-${{ needs.get-tag.outputs.tag }}.tar.gz" \
            ./*)
          rm -rf zip_root
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: game_jolt-arm64-builds
          path: advanced-invasion-*-${{ needs.get-tag.outputs.tag }}.*
  build-game_jolt-macos:
    name: Build macOS for Game Jolt
    needs: get-tag
    runs-on: macos-latest
    if: ${{ endsWith( needs.get-tag.outputs.tag, '-gj' ) }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Godot Engine
        uses: "./.github/actions/install-godot"
        with:
          version: "4.7.1-stable"
          sha_256: "897cb7f9799796c717ae75f31446aed883dc92b1d6c3b33d893cc7843fff2fa9"
          platform: "macos.universal"
      - name: Build Export Templates (macOS Universal)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "macos"
          arch: "universal"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          # Trying to adapt the command for macOS was too complicated to figure out completely, so I'm just installing GNU sed instead.
          echo "Running on macOS. Replacing BSD sed with GNU sed to avoid errors."
          brew install gnu-sed
          # See https://formulae.brew.sh/formula/gnu-sed
          PATH="$HOMEBREW_PREFIX/opt/gnu-sed/libexec/gnubin:$PATH"
          sed -i 's/\(config\/version="\).*\("\)/\1${{ needs.get-tag.outputs.tag }}\2/' project.godot
      - name: Inject PCK Encryption Keys
        run: |
          brew install gawk
          ./inject-pck-encryption-key.sh game_jolt-macos-universal ${{ secrets.PCK_ENCRYPTION_KEY }}
      - name: Build project
        run: make game_jolt-macos-universal
      - name: Package
        id: package
        run: |
          mkdir -p zip_root
          cp -r build/game_jolt/macos-universal/* zip_root
          rm -f zip_root/.gitkeep
          (cd zip_root && zip -r \
            "../advanced-invasion-macos-universal-${{ needs.get-tag.outputs.tag }}.zip" \
            ./*)
          rm -rf zip_root
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: game_jolt-macos-builds
          path: advanced-invasion-macos-universal-${{ needs.get-tag.outputs.tag }}.zip
  publish:
    name: Publish Game Jolt Release
    runs-on: ubuntu-latest
    needs: [get-tag, build-game_jolt, build-game_jolt-arm64, build-game_jolt-windows, build-game_jolt-macos]
    # github.events.inputs, unlike the inputs context, does not preserve boolean type. See https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#providing-inputs
    if: ${{ github.event_name == 'release' || ( (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' ) && github.event.inputs.release == 'true' ) }}
    steps:
      - name: Download Builds
        uses: actions/download-artifact@v8
        with:
          name: game_jolt-builds
          skip-decompress: false
          merge-multiple: true
      - name: Download macOS builds
        uses: actions/download-artifact@v8
        with:
          name: game_jolt-macos-builds
          skip-decompress: false
          merge-multiple: true
      - name: Download arm64 builds
        uses: actions/download-artifact@v8
        with:
          name: game_jolt-arm64-builds
          skip-decompress: false
          merge-multiple: true
      - name: Download Windows builds
        uses: actions/download-artifact@v8
        with:
          name: game_jolt-windows-builds
          skip-decompress: false
          merge-multiple: true
      - name: Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ needs.get-tag.outputs.tag }}" \
            advanced-invasion-*-${{ needs.get-tag.outputs.tag }}.* \
            --repo "${{ github.repository }}"
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Compile Release Notes
        run: |
          version_without_postfix=$( echo "${{ needs.get-tag.outputs.tag }}" | sed 's/-.*$//' )
          notes_file=$(if [ -f release-notes/${version_without_postfix}.md ]; then echo "release-notes/${version_without_postfix}.md"; else echo "release-notes/latest.md"; fi)
          echo "This release comprises the Game Jolt builds, which you would typically obtain through the game's Game Jolt page. There is no reason to use these if you are not a Game Jolt user. Instead, see the main release: [${version_without_postfix}](https://github.com/SpeedyVelcro/advanced-invasion/releases/tag/${version_without_postfix})" > release-notes.md
          echo "" >> release-notes.md
          cat $notes_file >> release-notes.md
      - name: Copy Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit \
            "${{ needs.get-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md

