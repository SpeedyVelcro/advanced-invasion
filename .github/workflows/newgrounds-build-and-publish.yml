name: Build and Publish (Newgrounds)
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Tag name of release, as displayed on GitHub (i.e. no ref/tags/ prefix). If provided, the build will be published on the release with the same tag (release must already exist)."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name of release, as displayed on GitHub (i.e. no ref/tags/ prefix). If provided, the build will be published on the release with the same tag (release must already exist)."
        required: false
        type: string
        default: ""
env:
  GODOT_VERSION: "4.7.1-stable"
permissions:
  contents: write
jobs:
  get-tag:
    name: Get Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get Release Tag
        id: get-tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "Tag will be: ${{ inputs.tag }}"
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "Tag will be: ${{ github.ref_name }}"
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
  build-newgrounds:
    name: Build for Newgrounds
    runs-on: ubuntu-latest
    needs: get-tag
    if: ${{ endsWith( needs.get-tag.outputs.tag, '-ng' ) }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Godot Engine
        uses: "./.github/actions/install-godot"
        with:
          version: "4.7.1-stable"
          sha_256: "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          platform: "linux.x86_64"
      - name: Build Export Templates (web)
        uses: "./.github/actions/build-export-templates"
        with:
          version: "4.7.1-stable"
          platform: "web"
          target: "release"
          encryption-key: ${{ secrets.PCK_ENCRYPTION_KEY }}
          install: "true"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          sed -i 's/\(config\/version="\).*\("\)/\1${{ needs.get-tag.outputs.tag }}\2/' project.godot
      - name: Inject PCK Encryption Key
        run: |
          ./inject-pck-encryption-key.sh newgrounds ${{ secrets.PCK_ENCRYPTION_KEY }}
      - name: Build project
        run: make newgrounds
      - name: Package
        id: package
        run: |
          mkdir -p zip_root
          cp -r build/newgrounds/* zip_root
          rm -f zip_root/.gitkeep
          (cd zip_root && zip -r \
              "../advanced-invasion-web-${{ needs.get-tag.outputs.tag }}.zip" \
              ./*)
          rm -rf zip_root
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: newgrounds-builds
          path: advanced-invasion-web-${{ needs.get-tag.outputs.tag }}.zip
  publish:
    name: Publish release
    needs: [get-tag, build-newgrounds]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || ( ( github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' ) && github.event.inputs.tag != '' ) }}
    steps:
      - name: Download Builds
        uses: actions/download-artifact@v8
        with:
          name: newgrounds-builds
          skip-decompress: false
          merge-multiple: true
      - name: Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ needs.get-tag.outputs.tag }}" \
            advanced-invasion-*-${{ needs.get-tag.outputs.tag }}.* \
            --repo "${{ github.repository }}"
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Compile Release Notes
        run: |
          version_without_postfix=$( echo "${{ needs.get-tag.outputs.tag }}" | sed 's/-.*$//' )
          notes_file=$(if [ -f release-notes/${version_without_postfix}.md ]; then echo "release-notes/${version_without_postfix}.md"; else echo "release-notes/latest.md"; fi)
          echo "This release is the Newgrounds build, which would you would typically be playing when you visit the game's page on Newgrounds. There is no reason to download this here. Instead, if you are a Newgrounds user, visit the game's page on Newgrounds. Or, if you are not a Newgrounds user, see the main release: [${version_without_postfix}](https://github.com/SpeedyVelcro/advanced-invasion/releases/tag/${version_without_postfix})" > release-notes.md
          echo "" >> release-notes.md
          cat $notes_file >> release-notes.md
      - name: Copy Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit \
            "${{ needs.get-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md

